name: Check Donghaeng service and agent contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public data
        run: python scripts/check_mock_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_APP_MODE: final
          VITE_BASE_PATH: /service/

  check:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DONGHAENG_PROVIDER: openai_responses
      OPENAI_API_KEY: ''
      DONGHAENG_PHOENIX_ENABLED: 'false'
      ACCESS_MODE: local_development
    steps:
      - name: Verify access to private sibling repositories
        env:
          GH_TOKEN: ${{ secrets.DONGHAENG_REPOSITORIES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DONGHAENG_REPOSITORIES_TOKEN is missing. Add a service Actions secret with Contents: read access to bigcontest-2026/model and bigcontest-2026/agent."
            exit 1
          fi
          for repository in bigcontest-2026/model bigcontest-2026/agent; do
            if ! gh api "repos/$repository/git/ref/heads/main" --silent; then
              echo "::error::Cannot read $repository on main. Check token repository selection, Contents: read permission, expiration, and organization approval."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          path: service
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bigcontest-2026/model
          path: model
          ref: main
          token: ${{ secrets.DONGHAENG_REPOSITORIES_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: bigcontest-2026/agent
          path: agent
          ref: main
          token: ${{ secrets.DONGHAENG_REPOSITORIES_TOKEN }}
          persist-credentials: false
      - name: Install model, agent and isolated evaluation dependencies
        run: python -m pip install -r requirements-agent-dev.txt
        working-directory: service/backend
      - name: Check required agent and service contracts without external model calls
        run: python service/scripts/check_backend_ci.py
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-agent-test-results
          path: service/.artifacts/backend-ci/
